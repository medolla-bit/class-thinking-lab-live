<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Class Thinking Lab</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 30px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      margin-bottom: 20px;
    }

    button {
      padding: 14px 24px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    #response {
      margin-top: 25px;
      font-size: 18px;
      line-height: 1.5;
      opacity: 0.95;
    }
  </style>
</head>

<body>

  <h1>Class Thinking Lab</h1>

  <div class="card">
    <input id="input" placeholder="Write your idea..." />
    <button onclick="send()">Send Idea</button>

    <div id="response"></div>
  </div>

  <script>
    async function send() {
      const text = document.getElementById("input").value;

      if (!text) return;

      document.getElementById("response").innerText = "Thinking...";

      const res = await fetch("/api/ai/coach", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          text,
          round: 1,
          noun1: "Seed",
          noun2: "Secret",
          previousResponses: []
        })
      });

      const data = await res.json();

      document.getElementById("response").innerText = data.reply;
    }
  </script>

</body>
</html>
