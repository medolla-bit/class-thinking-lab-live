<!DOCTYPE html>
<html>
<head>
  <title>Class Thinking Lab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: Arial; text-align: center; padding: 40px; background: #0f172a; color: white;">

  <h1>Class Thinking Lab</h1>

  <input id="input" placeholder="Write your idea..." style="padding:10px; width:250px;" />
  <br><br>

  <button onclick="send()" style="padding:10px 20px;">Send Idea</button>

  <p id="response" style="margin-top:20px;"></p>

  <script>
    async function send() {
      const text = document.getElementById("input").value;

      const res = await fetch("/ai", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });

      const data = await res.json();
      document.getElementById("response").innerText = data.reply;
    }
  </script>

</body>
</html>
